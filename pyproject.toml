[project]
name = "mimic-struct-predict"
version = "0.1.0"
description = "Delta sum NGC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "es-aces>=0.7.0",
    "hydra-core==1.3.2",
    "hydra-optuna-sweeper==1.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "meds>=0.4.1",
    "meds-extract~=0.3.0",
    "meds-tab>=0.2.0",
    "meds-transforms[local-parallelism]>=0.5.1",
    "ninja",
    "peft>=0.18.1",
    "polars>=1.27.1",
    "requests>=2.32.0",
    "scikit-learn>=1.9.0",
    "tabulate>=0.10.0",
    "torch==2.11.0",
    "seaborn>=0.13.2",
    "packaging>=26.2",
    "tensorboard>=2.20.0",
    "flash-attn==2.8.3.post2",
    "flash-linear-attention>=0.4.2",
    "gputil>=1.4.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "transformers>=5.5.3,<6.0.0",
    "liger-kernel>=0.8.5",
    "vllm==0.26.0",
]


[tool.uv]
system-certs = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "tre-mirror"
url = "https://nexus.mgmt.cld/repository/ngc-cloud-pypi/simple"
default = true