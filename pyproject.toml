[project]
name = "mimic-struct-predict"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiolimiter>=1.2.1",
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "es-aces>=0.7.0",
    "google-genai>=2.8.0",
    "hydra-optuna-sweeper>=1.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "meds>=0.4.1",
    "meds-extract>=0.3.0",
    "meds-tab>=0.2.0",
    "meds-transforms[local-parallelism]>=0.5.1",
    "netcal>=1.3.5",
    "nvidia-ml-py>=13.595.45",
    "peft>=0.18.1",
    "polars>=1.27.1",
    "pytest-mock>=3.15.1",
    "sentencepiece>=0.2.1",
    "tabulate>=0.10.0",
    "torch>=2.5.1",
    "trl[vllm]>=1.6.0",
    "vertexai>=1.71.1",
    "seaborn>=0.13.2",
    "packaging>=26.2",
    "ninja>=1.13.0",
    "flash-attn>=2.8.3.post1",
    "causal-conv1d>=1.6.2.post1",
    "flash-linear-attention>=0.4.2",
    "tensorboard>=2.20.0",
    "gputil>=1.4.0",
    "vllm>=0.12.0",
    "transformers>=4.57.6",
    "liger-kernel>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."MEDS_transforms.stages"]
regex_replacement = "mimic_struct_predict.preprocessing.meds.transforms.regex_replacement.regex_replacement:regex_replacement"
title_case_codes = "mimic_struct_predict.preprocessing.meds.transforms.to_title_case.title_case_codes:title_case_codes"
order_by_code_prefix = "mimic_struct_predict.preprocessing.meds.transforms.order_by_code_prefix.order_by_code_prefix:order_by_code_prefix"
add_prefix_rows = "mimic_struct_predict.preprocessing.meds.transforms.add_prefix_rows.add_prefix_rows:create_prefix_column"
add_time_rows = "mimic_struct_predict.preprocessing.meds.transforms.add_time_rows.add_time_rows:add_time_rows"
add_delta_rows = "mimic_struct_predict.preprocessing.meds.transforms.add_delta_rows.add_delta_rows:add_delta_rows"
merge_age_column = "mimic_struct_predict.preprocessing.meds.transforms.merge_age_column.merge_age_column:merge_age_column"

[project.scripts]
physionet_download = "mimic_struct_predict.preprocessing.meds.physionet_download:main"
pre_MEDS = "mimic_struct_predict.preprocessing.meds.pre_MEDS:main"

meds_tab_inference = "mimic_struct_predict.models.tabular.inference:main"

pre_training_tokenize = "mimic_struct_predict.models.pre_training.tokenize:main"
pre_training_train = "mimic_struct_predict.models.pre_training.train:main"

structured_pretraining_tokenize = "mimic_struct_predict.models.structured.pretraining_tokenize:main"
structured_pretraining = "mimic_struct_predict.models.structured.pretrain:main"
structured_create_task_prompts = "mimic_struct_predict.models.structured.create_task_prompts:main"
structured_inference_generative_rollout = "mimic_struct_predict.models.structured.inference_generative_rollout:main"
structured_inference_embedding = "mimic_struct_predict.models.structured.inference_embedding:main"
structured_train_embedding_logistic_regression = "mimic_struct_predict.models.structured.train_embedding_lr:main"
structured_inference_embedding_and_lr = "mimic_struct_predict.models.structured.inference_embedding_and_lr:main"

embedding_and_lr_train = "mimic_struct_predict.models.embedding_and_lr.train:main"
embedding_and_lr_inference = "mimic_struct_predict.models.embedding_and_lr.inference:main"
embedding_and_lr_inference_embedding_only = "mimic_struct_predict.models.embedding_and_lr.inference_embedding_only:main"

natural_language_create_task_ehr_texts = "mimic_struct_predict.models.natural_language.create_task_ehr_texts:main"
natural_language_create_model_prompts = "mimic_struct_predict.models.natural_language.create_model_prompts:main"
natural_language_sft = "mimic_struct_predict.models.natural_language.sft:main"
natural_language_inference = "mimic_struct_predict.models.natural_language.inference:main"
natural_language_inference_gemini = "mimic_struct_predict.models.natural_language.inference_gemini:main"
natural_language_grpo = "mimic_struct_predict.models.natural_language.grpo:main"

[tool.ruff]
exclude = [
    "data",
    "output",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-per-file-ignores = { "*.ipynb" = ["E402"] }

[tool.mypy]
python_version = "3.12"
# Enforce type annotations on all function definitions
disallow_untyped_defs = true
disallow_incomplete_defs = true
# Error on functions that return Any implicitly
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["mimic_struct_predict"]
exclude = [
    "^tests/",
    "^data/",
    "^output/",
    "mimic_struct_predict/preprocessing/meds/physionet_download.py"
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # Or whatever your test folder name is (e.g., "test")
norecursedirs = [".venv", "scratch", "*.egg-info", ".git", ".pytest_cache"]

[tool.uv]
no-build-isolation-package = ["flash-attn", "causal-conv1d"]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
