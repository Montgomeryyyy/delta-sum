dataset_dir: ???  # Required: directory of meds datasets with quantiles
output_dir: ???          # Required: directory to save outputs

split_names:
  train: train
  val: tuning

pad_to_multiple_of: 8

model:
  name: ???
  random_init: false
  config:
    dtype: bfloat16

tokenizer_dir: ???

# https://huggingface.co/docs/transformers/en/main_classes/trainer#transformers.TrainingArguments
training_args:
  # Training Duration and Batch Size
  per_device_train_batch_size: 4
  num_train_epochs: 1
  # Learning Rate & Scheduler
  learning_rate: 5e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.05
  # Optimizer
  optim: adamw_torch
  weight_decay: 0.01
  # Regularization & Training Stability
  gradient_accumulation_steps: 1
  # Mixed Precision Training
  bf16: true
  # Logging & Monitoring Training
  logging_strategy: steps
  logging_steps: 1
  # Experiment Tracking Integration
  report_to: "tensorboard"
  # Evaluation
  eval_strategy: steps
  eval_steps: 0.01
  per_device_eval_batch_size : 4
  # Checkpointing & Saving
  save_strategy: steps
  save_steps: 0.01
  save_total_limit: 1
  # Best Model Tracking
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  ## Dataloader
  dataloader_num_workers: ${oc.decode:${oc.env:NUM_WORKERS}}
  gradient_checkpointing: true

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
