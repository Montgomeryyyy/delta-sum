defaults:
  - _base
  - _self_


pre_processing:
  code_join_token: ${pre_processing.delimiter}${tokenizer.special_tokens.eoc_token}${pre_processing.delimiter}

tokenizer:
  min_frequency: 10
  delimiter: ${pre_processing.delimiter}
  special_tokens:
    unk_token: "Unknown"
    pad_token: "<PAD>"
    eoc_token: "\n" # End of Code token
  model_max_length: 512
  truncation_side: left
