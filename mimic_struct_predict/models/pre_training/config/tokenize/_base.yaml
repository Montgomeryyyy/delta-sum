dataset_dir: ???  # Required: directory of meds datasets with quantiles
output_dir: ???          # Required: directory to save outputs

overwrite: false

dataset:
  split_names:
    train: train
    val: tuning

pre_processing:
  delimiter: "//"
  split_on_delimiter: false
  append_numeric_values: false

tokenizer:
  pre_trained_tokenizer: null
  padding_side: right

tokenization:
  stride: 64
  max_length: 512

num_workers: 4
batch_size: 50

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
