dataset_dir: ???  # Required: directory of meds datasets with quantiles
output_dir: ???          # Required: directory to save outputs

overwrite: false

dataset:
  split_names:
    train: train
    val: tuning

pre_processing:
  delimiter: "//"
  split_on_delimiter: true
  append_numeric_values: false # Using quantiles so can compare to structured
  code_join_token: "\n\n"

tokenizer:
  pre_trained_tokenizer: ???
  padding_side: right

tokenization:
  stride: 64
  max_length: 512

num_workers: ${oc.decode:${oc.env:NUM_WORKERS}}
batch_size: 50

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
