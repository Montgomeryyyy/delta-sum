defaults:
  - natural_language
  - _self_

sampling_params:
  # HF sets id 1 to be eos automatically, so ignore it
  ignore_eos: true
  # We pad model to multiple of 8, so model can produce invalid tokens if not set to true
  set_max_token_id: true

tokenizer:
  join_with_delimiter: true
  keep_first_token: false
  delimiter: "//"
  max_input_length: 3072

event_extraction:
  code_splitter: "//\n\n//"

model:
  max_model_len: 4096
