
meds_dir: ???  # Required: directory of pre-built meds datasets
aces_dir: ???  # Required: directory of pre-built aces datasets
output_dir: ???          # Required: directory to save outputs
tasks: null # If null or empty, will run on all tasks in the dataset
overwrite: false

random_seed: 42

split_names:
  train: train
  val: tuning

code_join_token: "\n"

model:
  pretrained_model_name_or_path: ./pre_trained_models/Qwen3-0.6B

tokenization:
  max_prompt_length: 256
  enable_thinking: false
  # Note space
  yes_token: " Yes"
  no_token: " No"
  batch_size: null

task_description:
  30_day_readmission: "'Yes' if the patient will be hospitalised within 30 days of discharge, 'No' otherwise"
  icu_mortality: "'Yes' if the patient will die before being discharged from the ICU, 'No' otherwise"

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
