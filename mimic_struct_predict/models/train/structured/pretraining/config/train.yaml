tokenizer_dir: ???  # Required: directory of pre-trained tokenizer (which also contains the tokenized datasets)
output_dir: ???          # Required: directory to save outputs
seed: 42

split_names:
  train: train
  val: tuning

pad_to_multiple_of: 8

model:
  name: "gpt2"
  vocab_padding_multiple: 8

# https://huggingface.co/docs/transformers/en/main_classes/trainer#transformers.TrainingArguments
training_args:
  # Training Duration and Batch Size
  per_device_train_batch_size: 4
  max_steps : 10
  # Learning Rate & Scheduler
  learning_rate: 5e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.1
  # Optimizer
  optim: adamw_torch
  weight_decay: 0.01
  # Regularization & Training Stability
  gradient_accumulation_steps: 1
  # Mixed Precision Training
  fp16: true
  # Logging & Monitoring Training
  logging_strategy: steps
  logging_steps: 0.01
  # Experiment Tracking Integration
  report_to: "trackio"
  project: "mimic-struct-predict-structured-pretraining"
  trackio_space_id: null
  # Evaluation
  eval_strategy: steps
  eval_steps: 0.1
  per_device_eval_batch_size : 4
  # Checkpointing & Saving
  save_strategy: steps
  save_steps: 0.1
  save_total_limit: 3
  # Best Model Tracking
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
