dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
seed: 42

dataset:
  split_names:
    train: train
    val: tuning
  text_column: ehr_text

tokenization:
  special_tokens:
    unk_token: "Unknown"
    pad_token: "<PAD>"
    eoc_token: "\n" # End of Code token
  delimiter: "//"
  min_frequency: 5
  training_batch_size: 1000
  model_max_length: 512
  padding_side: right
  truncation_side: left
  stride: 64
  pad_to_multiple_of: 8

model:
  name: "gpt2"

# https://huggingface.co/docs/transformers/en/main_classes/trainer#transformers.TrainingArguments
training_args:
  # Training Duration and Batch Size
  per_device_train_batch_size: 4
  max_steps : 100
  # Learning Rate & Scheduler
  learning_rate: 5e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.1
  # Optimizer
  optim: adamw_torch
  weight_decay: 0.01
  # Regularization & Training Stability
  gradient_accumulation_steps: 1
  # Mixed Precision Training
  fp16: true
  # Logging & Monitoring Training
  logging_strategy: steps
  logging_steps: 0.01
  # Experiment Tracking Integration
  report_to: "trackio"
  project: "mimic-struct-predict-pre-training-coded"
  trackio_space_id: null
  # Evaluation
  eval_strategy: steps
  eval_steps: 0.1
  per_device_eval_batch_size : 4
  # Checkpointing & Saving
  save_strategy: steps
  save_steps: 0.1
  save_total_limit: 3
  # Best Model Tracking
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
