model:
  pretrained_model_name_or_path: ???
  dtype: bfloat16


dataset_dir: ???  # Required: directory of pre-built task prompt datasets
output_dir: ??? # Required: directory to save outputs
splits:
  - train
  - tuning
  - held_out

overwrite: true

tasks: null # If null or empty, will run on all tasks in the dataset

num_workers: 4
batch_size: 64

tokenization:
  max_length: 4096

hydra:
  run:
    dir: ${output_dir}/.logs/${now:%Y%m%d}/${now:%H%M%S}
