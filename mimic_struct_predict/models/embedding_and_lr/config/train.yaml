defaults:
  - override hydra/sweeper: optuna

random_seed: 42

task_dir: ???  # Required: directory of pre-built task prompt datasets
output_dir: ??? # Required: directory to save outputs

split_names:
  train: train
  val: tuning

lr:
  C: 1.0
  solver: lbfgs
  max_iter: 5000

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${random_seed}
    direction: maximize
    n_trials: 100
    n_jobs: 10
    params:
      lr.C: tag(log, interval(1e-4, 1e2))

  sweep:
    dir: ${output_dir}/multirun_${now:%Y%m%d_%H%M%S}
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
  callbacks:
    cleanup:
       _target_: mimic_struct_predict.models.embedding_and_lr.train.CleanupCallback
