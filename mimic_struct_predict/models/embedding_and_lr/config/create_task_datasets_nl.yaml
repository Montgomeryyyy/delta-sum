
meds_dir: ???  # Required: directory of pre-built meds datasets
aces_dir: ???  # Required: directory of pre-built aces datasets
output_dir: ???          # Required: directory to save outputs

overwrite: false

splits_to_process: ["train", "tuning", "held_out"]

pre_processing:
  delimiter: "//"
  delimiter_replacement: " "
  append_numeric_values: true
  numeric_values_sig_figs: 2
  code_join_token: "\n\n"

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
