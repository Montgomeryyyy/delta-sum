
data_dir: ???  # Required: directory of pre-built raw ehr text datasets
output_dir: ???          # Required: directory to save outputs
tasks: null # If null or empty, will run on all tasks in the dataset
overwrite: false

random_seed: 42

splits_to_process: ["train", "tuning", "held_out"]
train_split_name: train

model:
  is_gemini: false
  pretrained_model_name_or_path: ???

tokenization:
  max_ehr_tokens: 4096
  batch_size: null
  # Direct output "Yes"/"No" without "Thinking..." intermediate step
  enable_thinking: false
  output_format: yes_no  # Options: "yes_no", "probability"
  max_new_tokens: 1024
  token_buffer: 16
  character_per_token_heuristic: 6

task_description:
  ed_72hr_reattendance: "The patient has just been discharged from the Emergency Department.\n\
    Predict if the patient will have an Emergency Department Registration event within the next 72 hours following their discharge."
  ed_to_hospital_admission: "The patient has just been registered and triaged in the Emergency Department.\n\
    Predict if the patient will be admitted to the main hospital as an inpatient on discharge from the Emergency Department, instead of being discharged home, transferred to another hospital, or having any other disposition."
  hospital_length_of_stay_leq_7_days: "The patient has just been admitted to the hospital.\n\
    Predict if the patient will be discharged from the hospital in next 7 days (inclusive)."
  in_hospital_mortality: "The patient has been a hospital inpatient for 24 hours.\n\
    Predict if the patient will die before being discharged from their most recent inpatient hospital stay."
  hospital_post_discharge_30_day_mortality: "The patient has just been discharged from the hospital.\n\
    Predict if the patient will die within the next 30 days."

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
