
data_dir: ???  # Required: directory of pre-built raw ehr text datasets
output_dir: ???          # Required: directory to save outputs
tasks: null # If null or empty, will run on all tasks in the dataset
overwrite: false

random_seed: 42

splits_to_process: ["train", "tuning", "held_out"]
train_split_name: train

model:
  is_gemini: false
  pretrained_model_name_or_path: ./pre_trained_models/Qwen3-0.6B

tokenization:
  max_ehr_tokens: 256
  batch_size: null
  # Direct output "Yes"/"No" without "Thinking..." intermediate step
  enable_thinking: false
  output_format: yes_no  # Options: "yes_no", "probability"
  max_new_tokens: 256
  token_buffer: 16
  character_per_token_heuristic: 6

task_description:
  ed_72hr_reattendance: "Input: You are provided with this patient's EHR up to and including their most recent Emergency Department Discharge (the last batch of EHR events).\n\
    Outcome: True if the patient will have a Emergency Department Registration event in 72 hours following their discharge. False otherwise."
  ed_to_hospital_admission: "Input: You are provided with this patient's EHR up to and including their most recent Emergency Department Registration and Triage (the last batch of EHR events).\n\
    Outcome: True if the patient's future ED discharge disposition is admitted to the main hospital as an inpatient. False if the patient is discharged home, transferred to another hospital, or has any other disposition."
  hospital_length_of_stay_leq_7_days: "Input: You are provided with this patient's EHR up to and including their most recent inpatient hospital admission.\n\
    Outcome: True if the patient will be discharged within 7 days of their most recent inpatient hospital admission. False otherwise."
  in_hospital_mortality: "Input: You are provided with this patient's EHR up to and including the first 24 hours of their most recent inpatient hospital admission.\n\
    Outcome: True if the patient will die before being discharged from their most recent inpatient hospital stay. False otherwise."
  hospital_post_discharge_30_day_mortality: "Input: You are provided with this patient's EHR up to and including their most recent hospital discharge.\n\
    Outcome: True if the patient will die within 30 days of their most recent hospital discharge. False otherwise."

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
