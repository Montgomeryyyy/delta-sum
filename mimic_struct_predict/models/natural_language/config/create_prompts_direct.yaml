
data_dir: ???  # Required: directory of pre-built raw ehr text datasets
output_dir: ???          # Required: directory to save outputs
tasks: null # If null or empty, will run on all tasks in the dataset
overwrite: false

random_seed: 42

splits_to_process: ["train", "tuning", "held_out"]
train_split_name: train

model:
  is_gemini: false
  pretrained_model_name_or_path: ./pre_trained_models/Qwen3-0.6B

tokenization:
  max_prompt_length: 256
  # Note space
  yes_token: " Yes"
  no_token: " No"
  batch_size: null
  # Direct output "Yes"/"No" without "Thinking..." intermediate step
  enable_thinking: false
  max_new_tokens: 1
  token_buffer: 16
  character_per_token_heuristic: 6

task_description:
  los_hosp_3_days: "'Yes' if the patient will be discharged from hospital within the next 2 days, 'No' otherwise"
  los_icu_3_days: "'Yes' if the patient will be discharged from ICU within the next 2 days, 'No' otherwise"
  mortality_hosp_discharge_30_days: "'Yes' if the patient will die within 30 days of hospital discharge, 'No' otherwise"
  mortality_hosp_discharge_365_days: "'Yes' if the patient will die within 365 days of hospital discharge, 'No' otherwise"
  mortality_in_hosp: "'Yes' if the patient will die during this hospital stay, 'No' otherwise"
  mortality_in_icu: "'Yes' if the patient will die during this ICU stay, 'No' otherwise"
  readmission_hosp_30_days: "'Yes' if the patient will be readmitted to the hospital within 30 days of discharge, 'No' otherwise"

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
