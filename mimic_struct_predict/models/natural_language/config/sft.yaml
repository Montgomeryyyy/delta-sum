
dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
model: ???
tasks: null # If null or empty, will run on all tasks in the dataset
seed: 42

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}

lora:
  r: 16
  lora_alpha: 32
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "all-linear"

### SFT Specific ###

split_names:
  train: train
  val: tuning

brier_loss: false

training:
  # SFTTrainer parameters
  model_init_kwargs:
    attn_implementation: flash_attention_2
    dtype: float16
  ## Parameters that control the data preprocessing
  max_length: None
  shuffle_dataset: true
  pad_to_multiple_of: 8
  dataset_num_proc: null
  ## Parameters that control the loss
  completion_only_loss: true
  # TrainingArguments parameters
  ## Training Duration and Batch Size
  per_device_train_batch_size: 16
  max_steps : 20
  ## Learning Rate & Scheduler
  learning_rate: 2e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  ## Optimizer
  optim: adamw_8bit
  weight_decay: 0.01
  ## Regularization & Training Stability
  gradient_accumulation_steps: 4
  ## Mixed Precision Training
  fp16: true
  ## Logging & Monitoring Training
  logging_strategy: steps
  logging_steps: 1
  ## Evaluation
  eval_strategy: steps
  eval_steps: 10
  per_device_eval_batch_size: 16
  ## Checkpointing & Saving
  save_strategy: steps
  save_steps: 10  # Must match eval_steps for load_best_model_at_end to work correctly
  save_total_limit: 3
  ## Best Model Tracking
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: tensorboard
  ## Dataloader
  dataloader_num_workers: 1
