model:
  pretrained_model_name_or_path: ???
  attn_implementation: flash_attention_2
  dtype: bfloat16

dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
tasks: null # If null or empty, will run on all tasks in the dataset
seed: 42

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}

tracking:
  report_to: trackio
  project: mimic-struct-predict-grpo
  trackio_space_id: null

lora:
  r: 32
  lora_alpha: 64
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "all-linear"

### GRPO Specific ###

reward:
  output_format: yes_no_accuracy  # Options: "yes_no", "probability"
  # Expected completion format:
  # <think>
  # ...
  # </think>
  # <answer>
  # Yes|No
  # </answer>
  regex_pattern: '^<think>[\s\S]*?</think>[\s\S]*?<answer>\n(Yes|No)\n</answer>$'

split_names:
  train: train
  val: tuning

brier_loss: false

training:
  # SFTTrainer parameters
  ## Parameters that control the data preprocessing
  remove_unused_columns: false
  num_generations : 8
  max_completion_length: 1024
  shuffle_dataset: true
  ## Parameters that control generation
  generation_kwargs:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0
    max_tokens: 1024
  ## Parameters that control generation acceleration powered by vLLM
  use_vllm: true
  vllm_mode: "colocate"
  ## Parameters that control colocated vLLM execution (only used when `vllm_mode` is `"colocate"`)
  vllm_gpu_memory_utilization: 0.10
  vllm_max_model_length: 5120
  ## Parameters that control the training
  beta: 0.0
  ## Parameters that control the logging
  log_completions: true
  num_completions_to_print: 0
  # TrainingArguments parameters
  ## Training Duration and Batch Size
  per_device_train_batch_size: 16
  num_train_epochs : 5
  ## Learning Rate & Scheduler
  learning_rate: 5e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 0.1
  ## Optimizer
  optim: adamw_torch
  weight_decay: 0.01
  ## Regularization & Training Stability
  gradient_accumulation_steps: 8
  ## Mixed Precision Training
  bf16: true
  ## Logging & Monitoring Training
  logging_strategy: steps
  logging_steps: 0.005
  ## Logging
  disable_tqdm: True
  ## Evaluation
  eval_strategy: steps
  eval_steps: 0.025
  per_device_eval_batch_size: 32
  ## Checkpointing & Saving
  save_strategy: steps
  save_steps: 0.025  # Must match eval_steps for load_best_model_at_end to work correctly
  save_total_limit: 1
  ## Best Model Tracking
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
