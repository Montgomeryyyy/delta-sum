dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
tasks: null # If null or empty, will run on all tasks in the dataset
seed: 42

model: ???

run_dir: "${output_dir}/${now:%Y%m%d_%H%M%S}"

hydra:
  run:
    dir: ${run_dir}

tracking:
  report_to: tensorboard
  logging_dir: ${run_dir}

lora:
  r: 32
  lora_alpha: 64
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "all-linear"

### GRPO Specific ###

reward:
  output_format: yes_no_accuracy  # Options: "yes_no", "probability"
  # Expected completion format:
  # <think>
  # ...
  # </think>
  # <answer>"Yes|No"</answer>
  regex_pattern: '^<think>[\s\S]*?</think>[\s\S]*?<answer>"(Yes|No)"</answer>$'

split_names:
  train: train
  val: tuning


max_eval_samples: 2000
early_stopping_patience: 10

training:
  model_init_kwargs:
    attn_implementation: flash_attention_2
    dtype: float16
    use_cache: false
  ## Parameters that control the data preprocessing
  remove_unused_columns: false
  num_generations_eval : 1
  max_completion_length: 1024
  shuffle_dataset: true
  ## Parameters that control generation
  temperature: 1.0
  top_p: 1.0
  min_p: null
  top_k: 0
  # max_tokens: 1024
  # use_cache: true
  ## Parameters that control generation acceleration powered by vLLM
  use_vllm: true
  vllm_mode: "colocate"
  ## Parameters that control colocated vLLM execution (only used when `vllm_mode` is `"colocate"`)
  vllm_gpu_memory_utilization: 0.35
  vllm_max_model_length: 5632 # prompt + EHR + new tokens = ~512 + 4096 + 1024
  vllm_tensor_parallel_size: 1
  ## Parameters that control the training
  beta: 0.0
  ## Parameters that control the logging
  log_completions: true
  num_completions_to_print: 0
  # TrainingArguments parameters
  ## Training Duration and Batch Size
  num_train_epochs: 1
  # max_steps : 100
  ## Learning Rate & Scheduler
  learning_rate: 1e-5
  lr_scheduler_type: constant_with_warmup
  warmup_ratio: 0.01
  # warmup_steps: 10
  ## Optimizer
  optim: adamw_torch
  # weight_decay: 0.0
  ## Regularization & Training Stability
  # gradient_accumulation_steps: 1
  ## Mixed Precision Training
  bf16: false
  fp16: true
  ## Logging & Monitoring Training
  logging_strategy: steps
  logging_steps: 1
  ## Logging
  disable_tqdm: False
  ## Evaluation
  eval_strategy: "steps"
  eval_steps: 10
  per_device_eval_batch_size: 8
  ## Checkpointing & Saving
  save_strategy: "steps"
  save_steps: 10 # Must match eval_steps for load_best_model_at_end to work correctly
  save_total_limit: 3
  # ## Best Model Tracking
  load_best_model_at_end: true
  metric_for_best_model: eval_reward
  greater_is_better: true
  torch_compile: false
  use_liger_kernel: false
  logging_first_step: true
  dataloader_num_workers: 4

  num_generations : 8
  # steps_per_generation: 1
  gradient_accumulation_steps: 32
  per_device_train_batch_size: 8

  vllm_importance_sampling_correction: true
  vllm_importance_sampling_mode: token_truncate
  loss_type: "dapo"
