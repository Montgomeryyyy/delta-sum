defaults:
  - grpo_yes_no
  - _self_

tracking:
  project: mimic-struct-predict-grpo-probability

### GRPO Specific ###

reward:
  output_format: probability_brier  # Options: "yes_no", "probability"
  # Expected completion format:
  # <think>
  # ...
  # </think>
  # <answer>
  # 0.0-1.0 (any number of decimal places allowed including 0)
  # </answer>
  regex_pattern: '^<think>[\s\S]*?</think>[\s\S]*?<answer>"(0(?:\.\d+)?|1(?:\.0+)?)"</answer>$'
