# Inherits from llm_inference_direct.yaml, but overrides settings to enable thinking and adjust generation parameters accordingly.
defaults:
  - inference_thinking
  - _self_

tokenization:
  max_prompt_length: 256
  enable_thinking: true

generation:
  stop_strings:
    - "<answer>\nYes"
    - "<answer>\nNo"
  output_logits: true

post_processing:
  output_format: "yes_no"
  regex_pattern: "<answer>\n(Yes|No)"
