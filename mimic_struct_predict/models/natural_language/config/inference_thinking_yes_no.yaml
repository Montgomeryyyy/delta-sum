# Inherits from llm_inference_direct.yaml, but overrides settings to enable thinking and adjust generation parameters accordingly.
defaults:
  - inference_thinking
  - _self_

sampling_params:
  stop:
    - '<answer>"Yes'
    - '<answer>"No'
  include_stop_str_in_output: True
  logprobs: -1

post_processing:
  output_format: "yes_no"
  regex_pattern: '<answer>"(Yes|No)$'
