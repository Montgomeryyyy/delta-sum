model:
  pretrained_model_name_or_path: ./pre_trained_models/Qwen3.5-9B
  attn_implementation: flash_attention_2
  # attn_implementation: sdpa
  dtype: bfloat16

dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
split: ???
tasks: null

batch_size: 24
num_workers: 1

generation:
  use_cache: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  max_new_tokens: 64
  do_sample: true
  stop_strings:
    -"</answer>"

post_processing:
  # Match with content between <answer> and </answer> tags, non-greedy match to get the first occurrence
  # Includes newlines and other whitespace characters
  regex_pattern: '([\s\S]*?)(?=</answer>)'
  default_prob: 0.5

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
