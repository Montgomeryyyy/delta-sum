dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
split: ???
tasks: null
chunk_size: 5000
seed: 42
max_eval_samples: 5000

model:
  model: ???
  dtype: bfloat16
  tensor_parallel_size: 1
  max_model_len: 4600
  gpu_memory_utilization: 0.9

structured_outputs:
  choice:
    - "Yes"
    - "No"

sampling_params:
  max_tokens: 1
  logprobs: 2

  # temperature: 1.0
  # top_k: 64
  # min_p: 0.0
  # top_p: 0.95


post_processing:
  # Match with content between <answer> and </answer> tags, non-greedy match to get the first occurrence
  # Includes newlines and other whitespace characters
  output_format: yes_no
  regex_pattern: '(Yes|No)'
  default_prob: 0.5

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
