model:
  pretrained_model_name_or_path: ./pre_trained_models/Qwen3-0.6B
  dtype: float32


dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
split: ???
tasks:
  - mortality_hosp_discharge_30_days # If null or empty, will run on all tasks in the dataset

batch_size: 8
num_workers: 1

tokenization:
  max_prompt_length: 256
  enable_thinking: false
  batch_size: 50

generation:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  max_new_tokens: 64
  do_sample: true
  stop_strings:
    -"</answer>"

post_processing:
  # Match with content between <answer> and </answer> tags, non-greedy match to get the first occurrence
  # Includes newlines and other whitespace characters
  regex_pattern: '([\s\S]*?)(?=</answer>)'
  default_prob: 0.5

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
