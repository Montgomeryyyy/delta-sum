# Inherits from llm_inference_direct.yaml, but overrides settings to enable thinking and adjust generation parameters accordingly.
defaults:
  - inference_direct
  - _self_

tokenization:
  max_prompt_length: 256
  enable_thinking: true

generation:
  max_new_tokens: 256
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0

post_processing:
  # Update regex to include initial answer tag (as not included in prompt for thinking)
  regex_pattern: '(?<=<answer>)([\s\S]*?)(?=</answer>)'
