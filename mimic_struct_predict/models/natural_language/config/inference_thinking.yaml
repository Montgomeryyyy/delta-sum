# Inherits from llm_inference_direct.yaml, but overrides settings to enable thinking and adjust generation parameters accordingly.
defaults:
  - inference_direct
  - _self_

batch_size: 16

generation:
  max_new_tokens: 1024
  use_cache: true
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0

post_processing:
  output_format: ???
  regex_pattern: ???
