# Inherits from llm_inference_direct.yaml, but overrides settings to enable thinking and adjust generation parameters accordingly.
defaults:
  - inference_direct
  - _self_

tokenization:
  max_prompt_length: 256
  enable_thinking: true

generation:
  do_sample: true
  max_new_tokens: 256
  stop_strings:
    - "Answer: Yes"
    - "Answer: No"
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
