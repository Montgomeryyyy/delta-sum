model:
  pretrained_model_name_or_path: ???
  dtype: float32


dataset_dir: ???  # Required: directory of pre-built prompt datasets
output_dir: ???          # Required: directory to save outputs
split: ???
tasks: null # If null or empty, will run on all tasks in the dataset

num_workers: 4
batch_size: 4

tokenization:
  time_unspecified: "Unspecified"
  delimiter: "//"
  eoc_token: "\n"
  line_delimiter: ${tokenization.delimiter}${tokenization.eoc_token}${tokenization.delimiter}
  prefixes:
    category: "#### Category${tokenization.delimiter}"
    time: "### Time${tokenization.delimiter}"
    delta: "## Delta${tokenization.delimiter}"

generation:
  do_sample: true
  max_new_tokens: 64
  use_cache: false
  # Note effective batch size is num_return_sequences * batch_size
  num_return_sequences : 2

end_conditions:
  ed_72hr_reattendance:
    codes:
      - "Emergency Department Registration//"
    time:
      days: 3 # 72 hours
  ed_to_hospital_admission:
    codes:
      - "Hospital Admission//"
    time:
      days: 3 # Reasonable to assume that if a patient is admitted, it will be within a week of the ED visit
  hospital_length_of_stay_leq_7_days:
    codes:
      - "Hospital Discharge//"
    time:
      days: 7
  hospital_post_discharge_30_day_mortality:
    codes:
      - "Death//Died"
    time:
      days: 30
  in_hospital_mortality:
    codes:
      - "Death//Died"
      - "Hospital Discharge//"

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
