defaults:
  - natural_language
  - _self_

tokenizer:
  pre_trained_tokenizer: null
  min_frequency: 10
  delimiter: "//"
  special_tokens:
    unk_token: "Unknown"
    pad_token: "<PAD>"
    eoc_token: "\n\n" # End of Code token
  model_max_length: ${tokenization.max_length}
  truncation_side: left
