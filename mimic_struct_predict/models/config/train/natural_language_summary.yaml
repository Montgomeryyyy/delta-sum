dataset_dir: ???  # Required: directory of meds datasets with quantiles
output_dir: ???          # Required: directory to save outputs

split_names:
  train: train
  val: tuning

pad_to_multiple_of: 64
max_eval_samples: 5000
seed: 42
resume_from_checkpoint: null
# Chunked dataset: separate input_ids + labels; pack and mask input in the collator
custom_targets: true
# Padding-free: concatenate each microbatch into one row (needs flash_attention_2).
# Examples range from ~400 to 16k tokens, so padding would waste most of the compute.
packed: true

model:
  name: ???
  random_init: false
  config:
    dtype: bfloat16
    # Liger warns to use eager; that applies to Gemma2's attn soft-capping, which
    # gemma-3-270m does not use (attn_logit_softcapping: null). Eager would also
    # materialise full 16k x 16k scores for the 512-token sliding-window layers.
    attn_implementation: flash_attention_2
    # Otherwise Gemma3 builds a KV cache in forward, which wastes memory and disables
    # packed-sequence detection from position_ids.
    use_cache: false

tokenizer_dir: ???

# https://huggingface.co/docs/transformers/en/main_classes/trainer#transformers.TrainingArguments
training_args:
  # Packed microbatch of 4 examples (<= 4 x 16k tokens) fits an 80GB H100 without
  # gradient checkpointing. On OOM, set gradient_checkpointing=true or lower this.
  per_device_train_batch_size: 4
  num_train_epochs: 2
  # Learning Rate & Scheduler
  learning_rate: 1e-4
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 0.05
  # Optimizer
  optim: adamw_torch_fused
  weight_decay: 0.01
  # Regularization & Training Stability
  # Effective batch = 4 x 32 x NUM_GPUS examples; divide this by NUM_GPUS to keep 128.
  gradient_accumulation_steps: 32
  max_grad_norm: 1.0
  # Mixed Precision Training
  bf16: true
  bf16_full_eval: true
  tf32: true
  # Gradient Checkpointing
  gradient_checkpointing: false
  # Logging & Monitoring Training
  logging_strategy: steps
  logging_steps: 50
  # Logging
  log_level: "info"
  disable_tqdm: true
  # Experiment Tracking Integration
  report_to: "tensorboard"
  # Evaluation
  eval_strategy: steps
  eval_steps: 0.025
  per_device_eval_batch_size: 4
  prediction_loss_only: true
  # Checkpointing & Saving
  save_strategy: steps
  save_steps: 0.025
  save_total_limit: 1
  # Best Model Tracking
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  ## Dataloader
  dataloader_num_workers: 18
  dataloader_prefetch_factor: 4
  # DDP
  ddp_find_unused_parameters: false
  # Compilation
  torch_compile: false
  # torch_compile_mode: default
  # Kernels
  use_liger_kernel: true
  # Debugging & Profiling
  skip_memory_metrics: true

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
