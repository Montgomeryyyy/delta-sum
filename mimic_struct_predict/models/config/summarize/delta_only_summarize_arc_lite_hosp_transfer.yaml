# delta_only_summarize: raw pretraining dir (parquet under <split>/*.parquet)
# delta_summarize:      path to a summarized_dataset from a prior summarize run
input_dir: ???
output_dir: ???          # Required: Directory to save the summarized data

overwrite: true
chunk_size: 1000
seed: 42

debug: false
# Limit patients per split for smoke tests (null = full dataset).
max_patients: 50

dataset:
  split_names:
    train: train
    val: tuning


# First window has no prior updates, so it is a full summary. Later windows use `prompt`.
# Modes (prompt text decides what an "update" is; code only changes {previous_context}):
#   summarize            - plain per-chunk summaries
#   delta_only_summarize - {previous_context} = prior model outputs
#   delta_summarize      - {previous_context} = prior summaries from "summarize" mode
summarization:
  window_regex: "^#### Hospital Transfer"
  mode: "delta_only_summarize"
  # ARC sends system/user chat messages; do not apply a local HF chat template.
  use_chat_template: false

  initial_system_prompt: >
    You are a clinical summarization system for longitudinal EHRs.
    Produce concise, factual summaries. Preserve clinically relevant information
    and do not invent facts.

  initial_prompt: |
    Summarize the clinically relevant information in the EHR excerpt below.

    Include when relevant:
    - diagnoses, symptoms, treatments, procedures, and medications
    - laboratory results, vital signs, measurements, imaging, and study findings
    - meaningful worsening, improvement, resolution, or treatment response
    - clinically relevant normal, stable, benign, or negative findings

    Remove redundancy and administrative detail.
    Do not infer information not stated in the excerpt.

    EHR excerpt:
    {text}

    Clinical summary:

  system_prompt: >
    You are a clinical summarization system for longitudinal EHRs.
    Produce concise, factual clinical updates. Preserve clinically relevant new
    information and do not invent facts.

  prompt: |
    Given the previous clinical updates and the new EHR excerpt, extract the
    clinically relevant information that is not already represented in the
    previous updates.

    Include when relevant:
    - new diagnoses, symptoms, treatments, procedures, or medications
    - new laboratory results, vital signs, measurements, imaging, or study findings
    - meaningful worsening, improvement, resolution, or treatment response
    - new clinically relevant evidence that a known finding is stable, unchanged,
      benign, or absent

    Novelty is relative to the previous updates provided below.
    Do not assume that information omitted from them is already known.

    Do not repeat information already represented with the same clinical meaning.
    Routine repeated measurements need not be included unless they add clinically
    relevant information or change the interpretation of the patient's state.
    Do not include administrative details.
    Do not infer information not stated in the excerpt.

    Output exactly "No clinically meaningful update." only if the excerpt adds no
    clinically relevant information beyond the previous updates.

    Previous clinical updates:
    {previous_context}

    New EHR excerpt:
    {text}

    Clinical update:

# model.backend:
#   local (default) - local GPU via vLLM; needs dtype / gpu_memory_utilization / etc.
#   arc             - remote ARC AI chat API; no GPU required
model:
  backend: arc
  model: arc:lite
  api_base: https://ai.create.kcl.ac.uk/api/v1
  api_key_env: ARC_AI_API_KEY
  # Optional: HF tokenizer name for local truncation only. Omit to send full texts.
  # tokenizer: Qwen/Qwen2.5-7B-Instruct
  max_model_len: 200000
  max_concurrency: 1
  # Minimum seconds between ARC API calls (paces rate limits).
  request_interval_s: 2.0
  timeout_s: 120
  max_retries: 5

sampling_params:
  max_tokens: 1024
  temperature: 0.0
  repetition_penalty: 1.0
  seed: ${seed}

num_workers: 1
batch_size: 50

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
