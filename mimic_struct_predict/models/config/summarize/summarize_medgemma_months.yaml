# input_dir / output_dir are required by Hydra; scripts/pretrain-summary-generation.sh sets both.
input_dir: ???
output_dir: ???

overwrite: false
chunk_size: 5000
resume: true
keep_batches: false
seed: 42

# null = full dataset.
max_patients: 50

num_shards: ${oc.decode:${oc.env:SLURM_ARRAY_TASK_COUNT,1}}
shard_id: ${oc.decode:${oc.env:SLURM_ARRAY_TASK_ID,0}}
merge_shards: false

dataset:
  split_names:
    train: train
    val: tuning

summarization:
  window_regex: "^## New Month"
  mode: "summarize"
  use_chat_template: true
  system_prompt: >
    You are a clinical summarization system. Produce concise, factual summaries
    of EHR excerpts. Preserve clinically important information. Do not invent
    facts.
  prompt: |
    Summarize the EHR excerpt below.
    Include diagnoses, symptoms, treatments/procedures/medications, abnormal
    findings, important measurements, and meaningful changes when present.
    Remove redundancy and administrative detail. Use complete sentences and no
    introductory phrases.
    Write the summary as concise plain prose in complete sentences.
    Do not use headings, bullet points, numbered lists, Markdown, or section labels.
    EHR excerpt:
    {text}

model:
  # Set DOMAIN_ADAPT_MODEL_SUM to the local merged_model path (or pass model.model=...).
  model: ${oc.env:DOMAIN_ADAPT_MODEL_SUM}
  dtype: bfloat16
  # FP8 needs Hopper/Ada (H100, L40S); set both to null on A100.
  quantization: fp8
  kv_cache_dtype: fp8
  seed: ${seed}
  tensor_parallel_size: ${oc.decode:${oc.env:NUM_GPUS,1}}
  max_model_len: 20000
  gpu_memory_utilization: 0.9
  # MedGemma ships a multimodal processor; summarization is text-only.
  limit_mm_per_prompt:
    image: 0

sampling_params:
  max_tokens: 2048
  temperature: 0.0
  repetition_penalty: 1.0
  seed: ${seed}

num_workers: 1
batch_size: 50

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}_shard${shard_id}
