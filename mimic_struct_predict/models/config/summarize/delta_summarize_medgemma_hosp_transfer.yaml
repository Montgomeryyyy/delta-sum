# delta_only_summarize: raw pretraining dir (parquet under <split>/*.parquet)
# delta_summarize:      path to a summarized_dataset from a prior summarize run
input_dir: ???
output_dir: ???          # Required: Directory to save the summarized data

overwrite: true
chunk_size: 1000
seed: 42

debug: false
# Limit patients per split for smoke tests (null = full dataset).
max_patients: 50

dataset:
  split_names:
    train: train
    val: tuning


# First window has no prior updates, so it is a full summary. Later windows use `prompt`.
# Modes (prompt text decides what an "update" is; code only changes {previous_context}):
#   summarize            - plain per-chunk summaries
#   delta_only_summarize - {previous_context} = prior model outputs
#   delta_summarize      - {previous_context} = prior summaries from "summarize" mode
summarization:
  window_regex: "^#### Hospital Transfer"
  mode: "delta_summarize"
  use_chat_template: true

  system_prompt: >
    You are a clinical summarization system for longitudinal EHRs.
    Produce concise, factual clinical updates. Preserve clinically relevant new
    information and do not invent facts.

  prompt: |
    Given the previous clinical summaries and the new EHR excerpt, extract the
    clinically relevant information that is not already represented in the
    previous summaries.

    Include when relevant:
    - new diagnoses, symptoms, treatments, procedures, or medications
    - new laboratory results, vital signs, measurements, imaging, or study findings
    - meaningful worsening, improvement, resolution, or treatment response
    - new clinically relevant evidence that a known finding is stable, unchanged,
      benign, or absent

    Novelty is relative to the previous summaries provided below.
    Treat information as already known if it is represented anywhere in the
    previous summaries, even if it is phrased differently.

    Do not repeat information already represented with the same clinical meaning.
    Routine repeated measurements need not be included unless they add clinically
    relevant information or change the interpretation of the patient's state.
    Do not include administrative details.
    Do not infer information not stated in the excerpt.

    Output exactly "No clinically meaningful update." only if the excerpt adds no
    clinically relevant information beyond the previous summaries.

    Previous clinical summaries:
    {previous_context}

    New EHR excerpt:
    {text}

    Clinical update:
    
model:
  model: google/medgemma-27b-it
  dtype: bfloat16
  seed: ${seed}
  tensor_parallel_size: 1
  max_model_len: 20000
  gpu_memory_utilization: 0.9

sampling_params:
  max_tokens: 1024
  temperature: 0.0
  repetition_penalty: 1.0
  seed: ${seed}

num_workers: 1
batch_size: 50

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
