model:
  model: google/medgemma-27b-it
  dtype: bfloat16
  seed: ${seed}
  tensor_parallel_size: 1
  max_model_len: 20000
  gpu_memory_utilization: 0.9

sampling_params:
  max_tokens: 1024
  temperature: 0.0
  repetition_penalty: 1.0
  seed: ${seed}

num_workers: 1
batch_size: 50

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
