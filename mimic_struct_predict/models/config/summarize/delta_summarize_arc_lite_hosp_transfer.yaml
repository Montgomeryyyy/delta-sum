# model.backend:
#   local (default) - local GPU via vLLM; needs dtype / gpu_memory_utilization / etc.
#   arc             - remote ARC AI chat API; no GPU required

model:
  backend: arc
  model: arc:lite
  api_base: https://ai.create.kcl.ac.uk/api/v1
  api_key_env: ARC_AI_API_KEY
  # Optional: HF tokenizer name for local truncation only. Omit to send full texts.
  # tokenizer: Qwen/Qwen2.5-7B-Instruct
  max_model_len: 200000
  max_concurrency: 1
  # Minimum seconds between ARC API calls (paces rate limits).
  request_interval_s: 2.0
  timeout_s: 120
  max_retries: 5

sampling_params:
  max_tokens: 1024
  temperature: 0.0
  repetition_penalty: 1.0
  seed: ${seed}

num_workers: 1
batch_size: 50

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M%S}
