description: |-
  This pipeline takes MEDS ETL data and added prefix, time and delta rows to create a more hierarchical structure
  that reduces repeated tokens and adds more structure for language models to learn from.

output_dir: ${oc.env:OUTPUT_DIR}
input_dir: ${oc.env:INPUT_DIR}

# The shards mapping is stored in the root of the final output directory.
shards_map_fp: "${output_dir}/metadata/.shards.json"

etl_metadata:
  dataset_name: ${oc.env:DATASET_NAME}
  dataset_version: ${oc.env:DATASET_VERSION}
  pipeline_name: "add_headers"

### Insert hierarchical rows to reduce repeated tokens
stages:
  - add_prefix_rows:
      header: "#### "
  - add_time_rows:
      header: "### Time"
      eod_string: "Unspecified"
  - add_delta_rows:
      header: "## Delta"
