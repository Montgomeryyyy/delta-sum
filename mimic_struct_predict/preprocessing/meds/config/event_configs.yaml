# Natural Language adaptation of the MIMIC_IV_MEDS event_config.
# The resulting MEDS events can then be converted concatenated to either form a stream of discrete tokens
# or a natural language description of the patient's stay.
#
# Key modifications from ./event_config_original.yaml (can be most easily seen by comparing side by side):
# - Add semantic headers to each event and connectors between values.
# - Remove id fields (hadm_id, stay_id, etc.) as not used downstream
# - Replaces structured codes with descriptive natural language phrases and semantic connectors (e.g. icd codes with their descriptions).
# - Move all string fields to the code field (can be tokenized out later)
# - Numeric fields are kept to allow for quantile-based tokenization.
# - Traditional "static variables" are include as discrete events at admission time (e.g. gender, race, insurance, language, marital status)


hosp/admissions:
  ed_registration:
    code:
      - Emergency Department
      - Registration
    time: col(edregtime)
    time_format: "%Y-%m-%d %H:%M:%S"
  ed_out:
    code:
      - Emergency Department
      - Out
    time: col(edouttime)
    time_format: "%Y-%m-%d %H:%M:%S"
  admission:
    code:
      - Hospital Admission
      - Type
      - col(admission_type)
      - From
      - col(admission_location)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # Make insurance, marital status, and race standalone Patient Demographics events
  insurance:
    code:
      - Patient Demographics
      - Insurance
      - col(insurance)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  language:
    code:
      - Patient Demographics
      - Language
      - col(language)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  marital_status:
    code:
      - Patient Demographics
      - Marital Status
      - col(marital_status)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  race:
    code:
      - Patient Demographics
      - Race
      - col(race)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # We include gender at each admission instead of at start
  # as a "static variable". This reduces the likelihood it is truncated
  # This is joined from the subjects table in the pre-MEDS step.
  gender:
    code:
      - Patient Demographics
      - Gender
      - col(gender)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # Calculated from anchor_age and anchor_year in pre_MEDS.py
  age:
     code:
       - Patient Demographics
       - Age
     numeric_value: col(age)
     time: col(admittime)
     time_format: "%Y-%m-%d %H:%M:%S"
  discharge:
    code:
      - Hospital Discharge
      - To
      - col(discharge_location)
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # We omit the death event here as it is joined to the data in the subjects table in the pre-MEDS step.

hosp/diagnoses_icd:
  diagnosis:
    code:
      - Diagnosis
      - col(long_title)
    time: col(hadm_discharge_time)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/drgcodes:
  drg:
    code:
      - Diagnosis Related Group
      - col(description)
      - Severity
      - col(drg_severity)
      - Risk Of Mortality
      - col(drg_mortality)
    time: col(hadm_discharge_time)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/emar:
  medication:
    code:
      - Medication Administration
      - col(medication)
      - col(event_txt)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/hcpcsevents:
  hcpcs:
    code:
      - HCPCS Billing Item
      # Uses long_description if available, otherwise short_description (done in preMEDS.py)
      - col(long_description)
    time: col(chartdate)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/labevents:
  lab:
    code:
      - Laboratory Test
      - col(fluid)
      - col(label)
      - Priority
      - col(priority)
      - Value
      - col(valueuom)
      # HACK: If valuenum (float) is not null value (string) is set to None in preMEDS.py
      # Subsequent processing cleans up // notation
      - col(value)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: valuenum

hosp/omr:
  omr:
    code:
      - Clinical Observation
      - col(result_name)
    # Pre-MEDS transforms this to numeric so can be used for structured quantiles matching vital signs
    numeric_value: col(result_num)
    time: col(chartdate)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/patients:
  death:
    code:
      # Not using the MEDS official code for death (MEDS_DEATH) due to semantics.
      - Death
      - Died
    time: col(dod)
    # Days precision times set to EOD in pre-MEDS
    time_format:
      - "%Y-%m-%d %H:%M:%S"

hosp/pharmacy:
 medication_start:
   code:
     - Pharmacy Prescription
     - Start
     - col(medication)
     - Route
     - col(route)
     - Frequency
     - col(frequency)
     - Doses Per 24 Hrs
     - col(doses_per_24_hrs)
   time: col(starttime)
   time_format:
     - "%Y-%m-%d %H:%M:%S"
 medication_stop:
   code:
     - Pharmacy Prescription
     - Stop
     - col(medication)
   time: col(stoptime)
   time_format:
     - "%Y-%m-%d %H:%M:%S"

hosp/procedures_icd:
  procedure:
    code:
      - Hospital Procedure
      - col(long_title)
    time: col(chartdate)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/transfers:
  transfer:
    code:
      - Hospital Transfer
      - Type
      - col(eventtype)
      - To
      - col(careunit)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"

icu/icustays:
  icu_admission:
    code:
      - Icu Admission
      - To
      - col(first_careunit)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  icu_discharge:
    code:
      - Icu Discharge
      - From
      - col(last_careunit)
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"

icu/chartevents:
  event:
    code:
      - Icu Observation
      - col(label)
      - Value
      - col(valueuom)
      # HACK: If valuenum (float) is not null value (string) is set to None in preMEDS.py
      # Subsequent processing cleans up // notation
      - col(value)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: valuenum

icu/procedureevents:
  start:
    code:
      - Icu Procedure
      - Start
      - col(label)
    time: col(starttime)
    time_format: "%Y-%m-%d %H:%M:%S"
  end:
    code:
      - Icu Procedure
      - End
      - col(label)
    time: col(endtime)
    time_format: "%Y-%m-%d %H:%M:%S"

icu/inputevents:
  input_start:
    code:
      - Icu Input
      - Start
      - col(label)
      - Order Category
      - col(ordercategorydescription)
      - Rate
      - col(rateuom)
    time: col(starttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: rate
  input_end:
    code:
      - Icu Input
      - End
      - col(label)
      - Order Category
      - col(ordercategorydescription)
      - Status
      - col(statusdescription)
      - Amount
      - col(amountuom)
    time: col(endtime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: amount
  subject_weight:
    code:
      - Icu Observation
      - Patient Weight
      - KG
    time: col(starttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: patientweight

icu/outputevents:
  output:
    code:
      - Icu Output
      - col(label)
      - col(valueuom)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: value
