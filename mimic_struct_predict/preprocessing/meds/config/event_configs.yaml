# Natural Language adaptation of the ETHOS_ARES event_config_ed.yaml.
# The resulting MEDS events can then be converted concatenated to either form a stream of discrete tokens
# or a natural language description of the patient's stay.

# No ID columns are included apart from subject_id
# Seq_num not used although could be used for informative ordering (beyond alphabetical) in future
# Descriptions used instead of IDs (e.g. long_title instead of icd code and version)
# All other unused columns are noted

# Tables not used
# POE?

### ED

subject_id_col: subject_id

ed/diagnosis:
  diagnosis:
    code:
      - Emergency Department Diagnosis
      - col(long_title) # Joined from hosp/d_icd_diagnoses (icd_code + icd_version -> long_title)
    time: col(outtime) # Joined from ed/edstays
    time_format: "%Y-%m-%d %H:%M:%S"

ed/edstays:
  ed_registration_arrival:
    code:
      - Emergency Department Registration
      - Arrival Method
      - col(arrival_transport)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  ed_registration_gender:
    code:
      - Emergency Department Registration
      - Gender
      - col(gender)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  ed_registration_race:
    code:
      - Emergency Department Registration
      - Race
      - col(race)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  ed_registration_age:
     code:
       - Emergency Department Registration
       - Age
     numeric_value: col(age) # Calculated from hosp/patients anchor_age and anchor_year
     time: col(intime)
     time_format: "%Y-%m-%d %H:%M:%S"
  ed_out:
    code:
      - Emergency Department Discharge
      - Location
      - col(disposition)
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/pyxis:
  medication:
    code:
      - Emergency Department Medication Administration
      - col(name)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/triage:
  triage:
    code:
      - "Emergency Department Triage: Name, Unit, Value"
      - col(name)
      - col(unit)
      - col(value)
    numeric_value: value_num
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/vitalsign:
  # Cols not used: rhythm (implict as dropped in premeds see process_ed_vitals_df)
  vital_sign:
    code:
      - "Emergency Department Vital Sign: Name, Unit, Value"
      - col(name)
      - col(unit)
      - col(value)
    numeric_value: value_num
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/admissions:
  # edregtime, edouttime not used (as using MIMIC-ED extension)
  # Seperate out admission type, location etc in to sepearte events (will be grouped later)
  admission_type:
    code:
      - Hospital Admission
      - Type
      - col(admission_type)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  admission_location:
    code:
      - Hospital Admission
      - Location
      - col(admission_location)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  admission_insurance:
    code:
      - Hospital Admission
      - Insurance
      - col(insurance)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  admission_language:
    code:
      - Hospital Admission
      - Language
      - col(language)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  admission_marital_status:
    code:
      - Hospital Admission
      - Marital Status
      - col(marital_status)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  admission_race:
    code:
      - Hospital Admission
      - Race
      - col(race)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # Add gender and age as admission events
  admission_gender:
    code:
      - Hospital Admission
      - Gender
      - col(gender) # Joined from hosp/patients
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  admission_age:
     code:
       - Hospital Admission
       - Age
     numeric_value: col(age) # Calculated from hosp/patients anchor_age and anchor_year
     time: col(admittime)
     time_format: "%Y-%m-%d %H:%M:%S"
  discharge:
    code:
      - Hospital Discharge
      - Location
      - col(discharge_location)
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # We omit the death event here as it is joined to the data in the subjects table in the pre-MEDS step.

hosp/diagnoses_icd:
  diagnosis:
    code:
      - Hospital Diagnosis
      - col(long_title) # Use long title instead of version and code
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/drgcodes:
  drg:
    code:
      - "Diagnosis Related Group: Type, Description, Severity of Illness, Likelihood Of Mortality"
      - col(drg_type)
      - col(description) # Use instead of drg_code
      - col(drg_severity) # Add to code
      - col(drg_mortality) # Add to code
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/emar:
  medication:
    code:
      - Hospital Medication
      - col(medication)
      - col(event_txt)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/hcpcsevents:
  hcpcs:
    code:
      - HCPCS
      - col(long_description) # Uses long_description if available, otherwise short_description (done in preMEDS.py)
    time: col(chartdate) # Only chartdate column available so set EOD.
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/labevents:
  # Choose just to record event at time of result and not at collection as well
  lab:
    code:
      - "Laboratory Result: Fluid, Test, Priority, Units, Value"
      - Speciemen Coll
      - col(fluid)
      - col(label)
      - col(priority)
      - col(valueuom)
      - col(value)
    numeric_value: valuenum
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/microbiologyevents:
  microbiology:
    code:
      - "Microbiology Result: Sample, Test, Organism Grown, Antibiotic Tested, Sensitivity"
      - col(spec_type_desc)
      - col(test_name)
      - col(org_name)
      - col(ab_name)
      - col(interpretation)
    time: col(storetime) # date and time of when the microbiology result was available
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/omr:
  # Cols not used: seq_num
  # premeds.py filters only to Blood Pressure, BMI (kg/m2), Weight (lbs), Height (Inches) rows
  # Blood pressure is split into diastolic/systolic in premeds.py
  omr:
    code:
      - "Clinical Observation: Name, Unit, Value"
      - col(result_name)
      - col(result_unit)
    # Pre-MEDS transforms this to numeric so can be used for structured quantiles matching vital signs
    numeric_value: col(result_num)
    time: col(chartdate) # Only chartdate column available so set EOD.
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/patients:
  death:
    code:
      # Not using the MEDS official code for death (MEDS_DEATH) due to semantics.
      - Death
      - Died
    time: col(dod) # Combined with admissions deathtime in preMEDS.py
    time_format: "%Y-%m-%d %H:%M:%S"

