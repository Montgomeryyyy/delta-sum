# Natural Language adaptation of the ETHOS_ARES event_config_ed.yaml.
# The resulting MEDS events can then be converted concatenated to either form a stream of discrete tokens
# or a natural language description of the patient's stay.
#
# Key modifications from ./event_config_original.yaml (can be most easily seen by comparing side by side):
# - Add semantic headers to each event and connectors between values.
# - Remove id fields (hadm_id, stay_id, etc.) as not used downstream
# - Replaces structured codes with descriptive natural language phrases and semantic connectors (e.g. icd codes with their descriptions).
# - Move all string fields to the code field (can be tokenized out later)
# - Numeric fields are kept to allow for quantile-based tokenization.
# - Traditional "static variables" are include as discrete events at admission time (e.g. gender, race, insurance, language, marital status)
# - Birth event not included. Instead age is added at hospital admission

ed/edstays:
  ed_registration:
    code:
      - Emergency Department Registration
      - Registration
      - Arrival Method
      - col(arrival_transport)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  ed_out:
    code:
      - Emergency Department Discharge or Transfer
      - Disposition
      - col(disposition)
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/triage:
  temperature:
    code:
      - Emergency Department Triage
      - Temperature
    numeric_value: temperature
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  heart_rate:
    code:
      - Emergency Department Triage
      - Heart Rate
    numeric_value: heartrate
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  respiratory_rate:
    code:
      - Emergency Department Triage
      - Respiratory Rate
    numeric_value: resprate
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  o2_saturation:
    code:
      - Emergency Department Triage
      - O2 Saturation
    numeric_value: o2sat
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  blood_pressure_systolic:
    code:
      - Emergency Department Triage
      - Systolic Blood Pressure
    numeric_value: sbp
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  blood_pressure_diastolic:
    code:
      - Emergency Department Triage
      - Diastolic Blood Pressure
    numeric_value: dbp
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  pain:
    code:
      - Emergency Department Triage
      - Pain Score (0-10)
      - col(pain)
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
    stay_id: stay_id
  acuity:
    code:
      - Emergency Department Triage
      - Emergency Severity Index (1 most - 5 least urgent)
    numeric_value: acuity
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  chief_complaint:
    code:
      - Emergency Department Triage
      - Chief Complaint
      - col(chiefcomplaint)
    time: col(intime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"

ed/diagnosis:
  diagnosis:
    code:
      - Emergency Department Diagnosis
      - col(long_title)
    stay_id: stay_id
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"


ed/vitalsign:
  temperature:
    code:
      - Emergency Department Vital Sign
      - Temperature
    numeric_value: temperature
    time: col(charttime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  heart_rate:
    code:
      - Emergency Department Vital Sign
      - Heart Rate
    numeric_value: heartrate
    time: col(charttime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  respiratory_rate:
    code:
      - Emergency Department Vital Sign
      - Respiratory Rate
    numeric_value: resprate
    time: col(charttime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  o2_saturation:
    code:
      - Emergency Department Vital Sign
      - O2 Saturation
    numeric_value: o2sat
    time: col(charttime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  blood_pressure_systolic:
    code:
      - Emergency Department Vital Sign
      - Systolic Blood Pressure
    numeric_value: sbp
    time: col(charttime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  blood_pressure_diastolic:
    code:
      - Emergency Department Vital Sign
      - Diastolic Blood Pressure
    numeric_value: dbp
    time: col(charttime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
  pain:
    code:
      - Emergency Department Vital Sign
      - Pain Score (0-10)
      - col(pain)
    time: col(charttime)
    time_format:
      - "%Y-%m-%d %H:%M:%S"

hosp/admissions:
  admission:
    code:
      - Hospital Admission
      - Type
      - col(admission_type)
      - From
      - col(admission_location)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # Make insurance, marital status, and race standalone Patient Demographics events
  insurance:
    code:
      - Patient Demographics
      - Insurance
      - col(insurance)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  language:
    code:
      - Patient Demographics
      - Language
      - col(language)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  marital_status:
    code:
      - Patient Demographics
      - Marital Status
      - col(marital_status)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  race:
    code:
      - Patient Demographics
      - Race
      - col(race)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # We include gender at each admission instead of at start
  # as a "static variable". This reduces the likelihood it is truncated
  # This is joined from the subjects table in the pre-MEDS step.
  gender:
    code:
      - Patient Demographics
      - Gender
      - col(gender)
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # Calculated from anchor_age and anchor_year in pre_MEDS.py
  age:
     code:
       - Patient Demographics
       - Age
     numeric_value: col(age)
     time: col(admittime)
     time_format: "%Y-%m-%d %H:%M:%S"
  discharge:
    code:
      - Hospital Discharge
      - To
      - col(discharge_location)
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # We omit the death event here as it is joined to the data in the subjects table in the pre-MEDS step.

hosp/diagnoses_icd:
  diagnosis:
    code:
      - Diagnosis
      - col(long_title)
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/drgcodes:
  drg:
    code:
      - Diagnosis Related Group
      - col(description)
      - Severity
      - col(drg_severity)
      - Risk Of Mortality
      - col(drg_mortality)
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/emar:
  medication:
    code:
      - Hospital Medication Administration
      - col(medication)
      - col(event_txt)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/pyxis:
  medication:
    code:
      - Emergency Department Medication Administration
      - col(name)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    stay_id: stay_id

hosp/hcpcsevents:
  hcpcs:
    code:
      - HCPCS Billing Item
      # Uses long_description if available, otherwise short_description (done in preMEDS.py)
      - col(long_description)
    time: col(chartdate)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/labevents:
  lab:
    code:
      - Laboratory Test
      - col(fluid)
      - col(label)
      - Priority
      - col(priority)
      - Value
      - col(valueuom)
      # HACK: If valuenum (float) is not null value (string) is set to None in preMEDS.py
      # Subsequent processing cleans up // notation
      - col(value)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: valuenum

hosp/omr:
  omr:
    code:
      - Clinical Observation
      - col(result_name)
    # Pre-MEDS transforms this to numeric so can be used for structured quantiles matching vital signs
    numeric_value: col(result_num)
    time: col(chartdate)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/patients:
  death:
    code:
      # Not using the MEDS official code for death (MEDS_DEATH) due to semantics.
      - Death
      - Died
    time: col(dod)
    # Days precision times set to EOD in pre-MEDS
    time_format:
      - "%Y-%m-%d %H:%M:%S"

