hosp/procedures_icd:
  procedure:
    code:
      - Hospital Procedure
      - col(long_title) # Joined from hosp/d_procedures (icd_code + icd_version -> long_title)
    time: col(chartdate)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/services:
  service_to:
    code:
      - Hospital Service
      - To
      - col(curr_service)
    time: col(transfertime)
    time_format: "%Y-%m-%d %H:%M:%S"
  service_from:
    code:
      - Hospital Service
      - From
      - col(prev_service)
    time: col(transfertime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/transfers:
  transfer_from:
    code:
      - Hospital Transfer
      - From
      - col(careunit)
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"
  transfer_to:
    code:
      - Hospital Transfer
      - To
      - col(careunit)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  transfer_type:
    code:
      - Hospital Transfer
      - Type
      - col(eventtype)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"

icu/icustays:
  icu_admission:
    code:
      - Icu Admission
      - To
      - col(first_careunit)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  icu_discharge:
    code:
      - Icu Discharge
      - From
      - col(last_careunit)
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"

