# Adapted from MEDS_extract example config
# https://github.com/mmcdermott/MEDS_extract/blob/51eef880722722ec9289b15358f5f33f70ea53e8/src/MEDS_extract/configs/_extract.yaml

etl_metadata.pipeline_name: "extract"

description: |-
  This pipeline extracts raw MEDS events in longitudinal, sparse form from an input dataset meeting select
  criteria and converts them to the flattened, MEDS format. It can be run in its entirety, with controllable
  levels of parallelism, or in stages. Arguments:
    - `event_conversion_config_fp`: The path to the event conversion configuration file. This file defines
      the events to extract from the various rows of the various input files encountered in the global input
      directory.
    - `input_dir`: The path to the directory containing the raw input files.
    - `output_dir`: The path to the directory where the output cohort will be written. It will be written in
      various subfolders of this dir depending on the stage, as intermediate stages cache their output during
      computation for efficiency of re-running and distributing.

# The event conversion configuration file is used throughout the pipeline to define the events to extract.
event_conversion_config_fp: mimic_struct_predict/preprocessing/meds/config/event_configs.yaml
# The shards mapping is stored in the root of the final output directory.
shards_map_fp: "${output_dir}/metadata/.shards.json"

  # calculate_age:
  #   birth_prefix: "Birth"
  #   drop_birth_rows: true
  # add_time_column:
  #   time_format: "%H:%M"
  #   replace_end_of_day: true
  #   end_of_day_fill_value: null



stages:
  - shard_events
  - split_and_shard_subjects
  - convert_to_subject_sharded
  - convert_to_MEDS_events
  - merge_to_MEDS_cohort
  ### Custom MEDS transforms
  - regex_replacement:
      column: "code"
      # Fix up repeated/trailing slashes and UNK tokens
      patterns:
        - pattern: "/{3,}"
          replacement: "//"
        - pattern: "//$"
          replacement: ""
        - pattern: "//UNK$"
          replacement: "//UNKNOWN"
        - pattern: "//UNK//"
          replacement: "//UNKNOWN//"
  - title_case_codes
  - order_by_code_prefix:
      # Priority from first to last
      prefix_priority:
      # Birth
      - "Birth"
      # Admissions
      - "Emergency Department"
      - "Hospital Transfer" # Includes ED->Hospital transfers
      - "Hospital Admission"
      - "Patient Demographics" # Recorded at admission time
      - "Icu Admission"
      # Lab results and observations
      - "Laboratory Test"
      - "Clinical Observation"
      - "Icu Observation"
      - "Icu Output"
      # Interventions and treatments
      - "Pharmacy Prescription"
      - "Medication Administration"
      - "Icu Medication"
      - "Icu Input"
      - "Hospital Procedure"
      - "Icu Procedure"
      # Death (discharge and billing happens after death)
      - "Death"
      # Discharges
      - "Icu Discharge"
      - "Hospital Discharge"
      # Billing codes
      - "Diagnosis"
      - "Diagnosis Related Group"
      - "Hcpcs Billing Item"
  ### Additional columns for next token prediction format
  - add_prefix_rows:
      header: "#### "
  - add_time_rows:
      header: "### Time"
  - add_age_rows:
      header: "## Age"
      birth_code: "#### Birth"
  ### Metadata stages
  - extract_code_metadata
  - finalize_MEDS_metadata
  - finalize_MEDS_data
