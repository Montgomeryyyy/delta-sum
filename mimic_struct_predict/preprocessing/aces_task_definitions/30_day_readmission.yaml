metadata:
  description: >-
    Outcome is true if patient is readmitted to the hospital within 30 days of hospital discharge otherwise false.

predicates:
  hospital_discharge:
    code: {regex: "Hospital Discharge//.*"}
  hospital_admission:
    code: {regex: "Hospital Admission//.*"}

trigger: hospital_discharge

windows:
  input:
    start: NULL # Include all events prior to hospital discharge
    end: trigger
    start_inclusive: True
    end_inclusive: True # Include all events up to and including hospital discharge
    index_timestamp: end

  target:
    # Target true if hospital admission event occurs within 30 days of hospital discharge
    start: trigger
    end: start + 30 days

    start_inclusive: True
    end_inclusive: True

    label: hospital_admission
