metadata:
  description: >-
    True if patient is discharged from the hospital within 2-3 days of hospital admission, false otherwise.
    Prediction is made at 24 hrs after hospital admission,
    and only includes patients who are alive and have not been discharged from the hospital within 24 hrs of hospital admission.

predicates:
  hospital_admission:
    code: {regex: "Hospital Admission//.*"}
  hospital_discharge:
    code: {regex: "Hospital Discharge//.*"}
  death:
    code: "Death//Died"

trigger: hospital_admission

windows:
  input:
    # All of patients history up until hospital admission + 24hrs
    start: NULL
    end: trigger + 24h
    start_inclusive: True
    end_inclusive: True
    index_timestamp: end
  gap:
    # Drop events where patient dies or is discharged between hospital admission and admission + 24hrs
    start: trigger
    end: start + 24h
    start_inclusive: False
    end_inclusive: True
    has:
      death: (None, 0)
      hospital_discharge: (None, 0)
  target:
    # True if patient is discharged from the hospital within 2-3 days of hospital admission, false otherwise
    start: gap.end
    end: start + 3 days
    start_inclusive: False
    end_inclusive: True
    label: hospital_discharge
