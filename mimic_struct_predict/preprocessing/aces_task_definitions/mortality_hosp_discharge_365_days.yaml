metadata:
  description: >-
    True if patient dies in the 365 days after hospital discharge, false otherwise.
    Prediction is made at hospital discharge, and only includes patients who survive until hospital discharge.

predicates:
  hospital_discharge:
    code: {regex: "Hospital Discharge//.*"}
  death:
    code: "Death//Died"

trigger: hospital_discharge

windows:
  input:
    # All of patients history up until hospital discharge
    start: NULL
    end: trigger
    start_inclusive: True
    end_inclusive: True
    index_timestamp: end
  gap:
    # Drop events where patient dies before hospital discharge
    start: NULL
    end: trigger
    start_inclusive: False
    end_inclusive: True
    has:
      death: (None, 0)
  target:
    # True if patient dies 365 days after hospital discharge, false otherwise
    start: gap.end
    end: start + 365 days
    start_inclusive: False
    end_inclusive: True
    label: death
